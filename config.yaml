camera:
  index: 0
  width: 1280
  height: 720
  fps: 60
  # Optional OpenCV calibration file (npz/OpenCV YAML or NPZ with camera_matrix, dist_coeffs)
  calibration_file: null

model:
  # Ultralytics weights path; yolov8n.pt downloads on first run
  path: yolov8n.pt
  conf: 0.35
  iou: 0.45
  imgsz: 640          # inference size (display stays 1280x720; boxes scaled back)
  max_det: 20
  half: true          # FP16 on CUDA — big FPS win, negligible accuracy loss
  device: ""          # "" = auto, "cpu", "0" for CUDA
  # Custom class names for AeroShield training; empty = COCO + stub mapping
  class_names: []
  # Only these COCO ids when using stub map (airplane=4, bird=14, kite=33)
  filter_classes: [4, 14, 33]
  coco_stub_map:
    airplane: F16
    bird: MiniIHA
    kite: BalistikFuze
    helicopter: Helikopter

performance:
  jpeg_quality: 70      # IPC encode quality (lower = faster)
  camera_buffer: 1      # OpenCV buffer — 1 = lowest latency
  infer_every_n: 1      # 2 = skip alternate frames (Kalman coast) if still slow

serial:
  port: "COM3"
  baud: 115200
  timeout_s: 0.05
  failsafe_timeout_s: 0.5
  rate_hz: 30
  mock: true  # true = no ESP32 required

control:
  pid_pan: { kp: 0.45, ki: 0.02, kd: 0.08, i_limit: 40.0 }
  pid_tilt: { kp: 0.45, ki: 0.02, kd: 0.08, i_limit: 40.0 }
  lock_angle_deg: 0.3
  frame_center: [640, 360]  # overwritten from camera size at runtime
  degrees_per_pixel: 0.045
  manual_step: 25  # pan/tilt step for WASD keys
  pan_limits_deg: [0, 270]
  tilt_limits_deg: [-30, 60]

wez:
  F16: [10.0, 15.0]
  Helikopter: [5.0, 15.0]
  BalistikFuze: [5.0, 15.0]
  MiniIHA: [0.0, 15.0]

# Pinhole monocular range: distance_m = (object_height_m * focal_length_px) / bbox_height_px
# Calibrate with calibration.range_m + calibration.bbox_height_px at a known distance.
range_estimator:
  enabled: true
  fov_deg: 78.0          # Logitech C930E horizontal FOV (approx.)
  focal_length_px: null   # auto from camera.width + fov_deg if null
  smooth_alpha: 0.35      # EMA per track ID
  min_m: 0.5
  max_m: 20.0
  object_heights_m:       # Maket fiziksel yükseklik tahmini (metre)
    default: 0.55
    F16: 0.72
    Helikopter: 0.62
    BalistikFuze: 0.48
    MiniIHA: 0.35
  calibration:            # Opsiyonel tek nokta kalibrasyon (10 m'de ölçülen bbox yüksekliği)
    range_m: 10.0
    bbox_height_px: 48.0

safety:
  pan_forbidden_min: 200
  pan_forbidden_max: 270
  maintenance_total_s: 600
  maintenance_min_s: 30

ui:
  window_title: "AeroShield GCS"
  target_gui_hz: 20
  display_max_width: 960
