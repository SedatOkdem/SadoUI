camera:
  index: 1
  width: 1920
  height: 1080
  fps: 30  # C920 1080p MJPEG @ 30
  backend: dshow  # dshow | msmf | auto (auto tries both and is slower to open)
  # Optional OpenCV calibration file (npz/OpenCV YAML or NPZ with camera_matrix, dist_coeffs)
  calibration_file: null

model:
  # Trained Celik Kubbe weights (python scripts/train_celikkubbe.py).
  # Missing file → fallback_path (COCO stub map).
  path: models/aeroshield.pt
  fallback_path: yolov8n.pt
  conf: 0.80
  iou: 0.45
  imgsz: 640          # match train letterbox
  max_det: 10
  half: true
  device: ""
  conf_by_class:
    F16: 0.80
    BalistikFuze: 0.80
    Helikopter: 0.80
    MiniIHA: 0.80
    Dost: 0.80
  dataset: datasets/aeroshield-merged/data.yaml
  # Order must match merged dataset: 0 F16, 1 Fuze, 2 Helikopter, 3 MiniIHA, 4 Dost
  class_names: [F16, BalistikFuze, Helikopter, MiniIHA, Dost]
  # Only these COCO ids when using fallback_path (airplane=4, bird=14, kite=33)
  filter_classes: [4, 14, 33]
  coco_stub_map:
    airplane: F16
    bird: MiniIHA
    kite: BalistikFuze
    helicopter: Helikopter

# Silhouette match for untextured 3D props (shape, not paint color).
shape_detect:
  enabled: true
  min_corr: 0.80
  fuze_min_corr: 0.80
  f16_min_corr: 0.80
  f16_templates: [f16, f16_prop]
  min_area_frac: 0.0015
  max_area_frac: 0.35
  work_width: 320
  every_n: 5

# Bbox paint IFF: dominant red → düşman (sınıf kalır), blue → Dost
color_iff:
  enabled: true
  classes: [Helikopter, F16, MiniIHA, BalistikFuze]
  min_frac: 0.06
  ratio: 1.2

performance:
  jpeg_quality: 55      # UI-only encode (camera→infer uses shared memory)
  camera_buffer: 1
  infer_every_n: 2      # 1/2 YOLO; Kalman coasts — camera stays 1080p

serial:
  port: "COM3"
  baud: 115200
  timeout_s: 0.05
  failsafe_timeout_s: 1.5
  rate_hz: 40
  mock: true  # Gerçek ESP: kutuyu kapat, COM seç, ESP BAĞLAN

control:
  # Slow complete close; reverse is a hard brake (see PID accel_dps2).
  pid_pan: { kp: 1.4, ki: 0.02, kd: 0.35, i_limit: 6.0, out_limit: 28.0, accel_dps2: 40.0 }
  pid_tilt: { kp: 1.1, ki: 0.015, kd: 0.28, i_limit: 4.0, out_limit: 18.0, accel_dps2: 28.0 }
  pid_deadzone_deg: 0.35
  lock_angle_deg: 0.4
  frame_center: [640, 360]  # overwritten from camera size at runtime
  degrees_per_pixel: 0.045
  invert_track_pan: true  # Stage 2/3 takip; WASD pan yönü değişmez
  track_slew_dps: 28
  tilt_slew_dps: 18
  sticky_lost_frames: 10  # kutu gidince bu kadar kare başka hedefe atlama
  sticky_center_frac: 0.55  # yeni hedef ekranın bu kadar merkezinde olmalı
  jog_pan_dps: 40         # WASD basılı tut (Aşama 1), slider'a açı yazmaz
  jog_tilt_dps: 25
  manual_step: 8  # WASD pan step (degrees)
  tilt_step: 2    # WASD tilt step (degrees)
  home_pan_deg: 135     # ileri bakış (0 ve 270 karşı uçlar)
  home_tilt_deg: 0
  pan_limits_deg: [0, 270]
  tilt_limits_deg: [-30, 60]

weapon:
  fire_spin_s: 0.45
  esc_idle_us: 1060
  esc_fire_us: 1200   # varsayılan ateş; panel 1000–2000 (şimdilik soft 1200 yok)

wez:
  F16: [10.0, 15.0]
  Helikopter: [5.0, 15.0]
  BalistikFuze: [5.0, 15.0]
  MiniIHA: [0.0, 15.0]

# Pinhole monocular range: distance_m = (object_height_m * focal_length_px) / bbox_height_px
# Calibrate with calibration.range_m + calibration.bbox_height_px at a known distance.
range_estimator:
  enabled: true
  fov_deg: 78.0          # Logitech C930E horizontal FOV (approx.)
  focal_length_px: null   # auto from camera.width + fov_deg if null
  smooth_alpha: 0.35      # EMA per track ID
  min_m: 0.5
  max_m: 20.0
  object_heights_m:       # Maket fiziksel yükseklik tahmini (metre)
    default: 0.55
    F16: 0.72
    Helikopter: 0.62
    BalistikFuze: 0.48
    MiniIHA: 0.35
  calibration:            # Opsiyonel tek nokta kalibrasyon (10 m'de ölçülen bbox yüksekliği)
    range_m: 10.0
    bbox_height_px: 48.0

safety:
  pan_forbidden_min: 200
  pan_forbidden_max: 270
  maintenance_total_s: 600
  maintenance_min_s: 30
  # true = no physical E-Stop button; software reset is enough
  ignore_hw_estop: true
  estop_enabled: false  # şimdilik E-STOP kapalı; true yapınca tekrar aktif

ui:
  window_title: "AeroShield GCS"
  target_gui_hz: 25
  display_max_width: 960
